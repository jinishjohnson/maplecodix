<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>MapleCodix | Digital Studio — Websites, Web Apps &amp; Growth</title>
    <meta
      name="description"
      content="MapleCodix is a premier Canadian digital engineering studio in Moncton, NB. We build high-performance websites, custom web applications, and growth architecture."

      name="keywords"
      content="MapleCodix, web development Moncton, custom web apps, React TypeScript, e-commerce, digital studio Canada, 24*7 support, high performance websites"

    <meta name="theme-color" content="#c91f26" />
    <link rel="canonical" href="https://maplecodix.com" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maplecodix.com" />
    <meta property="og:title" content="MapleCodix | Digital Studio — Websites, Web Apps &amp; Growth" />

      property="og:description"
      content="High-performance websites, custom web apps, and growth marketing engineered by Canadian architects in Moncton, NB. Sub-200ms latency, zero template bloat."

    <meta property="og:image" content="https://maplecodix.com/maplecodix-logo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="MapleCodix" />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="High-performance websites, custom web apps, and growth marketing engineered by Canadian architects in Moncton, NB."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Favicon & Mobile App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/maplecodix-logo.jpg" />
